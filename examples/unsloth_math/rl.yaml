model:
  name: "unsloth/Qwen3-8B-Base"
  adapter_path: outputs/unsloth_math_sft/adapter
  torch_dtype: bfloat16
  attn_implementation: sdpa
  load_in_4bit: false
  activation_checkpointing:
    mode: full
  matmul_precision: high
  fused_lm_head_token_chunk_size: auto
  chat_template: |-
    {% if messages[0]['role'] == 'system' %}{{ messages[0]['content'] + eos_token }}{% set loop_messages = messages[1:] %}{% else %}{{ 'You are given a problem.
    Think about the problem and provide your working out.
    Place it between <start_working_out> and <end_working_out>.
    Then, provide your solution between <SOLUTION></SOLUTION>' + eos_token }}{% set loop_messages = messages %}{% endif %}{% for message in loop_messages %}{% if message['role'] == 'user' %}{{ message['content'] }}{% elif message['role'] == 'assistant' %}{{ message['content'] + eos_token }}{% endif %}{% endfor %}{% if add_generation_prompt %}{{ '<start_working_out>' }}{% endif %}

data:
  source: local
  path: outputs/unsloth_math_data/rl_train.jsonl
  prompt_column: prompt
  completion_column: solution
  batch_size: 16
  micro_batch_size: 4
  pack_sequences: false
  pad_to_multiple_of: 1
  seq_len: 8192
  max_examples: 256
  shuffle: true
  seed: 3407

loss:
  type: dppo
  dppo_mask_high: 0.2
  dppo_mask_low: 0.2
  kl_tau: 1e-3

algo:
  type: grpo

orchestrator:
  enabled: true
  state_server:
    enabled: true
    host: 0.0.0.0
    port: 8765
  examples_per_step: 4
  rollouts_per_example: 8
  rollout_chunk_examples: 2
  filter_zero_advantage: true
  zero_advantage_max_retries: 8
  max_async_level: 8
  max_off_policy_steps: 8
  max_pending_rollout_chunks: 64

transport:
  poll_interval_seconds: 0.05

eval:
  interval: 20
  num_examples: 16
  rollouts_per_example: 4
  eval_base_model: false
  final_eval: false

inference:
  enabled: true
  mode: vllm_http
  default_temperature: 1.0
  sampling:
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    min_p: 0.0
    repetition_penalty: 1.0
    max_prompt_tokens: 512
    max_completion_tokens: 7680
    do_sample: true
    num_generations: 1
    extra_body:
      stop:
        - "</SOLUTION>"
      include_stop_str_in_output: true
  vllm:
    server_backend: openai
    gpu_memory_utilization: 0.9
    max_model_len: 8192
    enforce_eager: false
    max_lora_rank: 32
  http:
    request_timeout_seconds: 900.0
    startup_timeout_seconds: 900.0

reward:
  mode: math_format
  normalize_whitespace: true
  case_sensitive: true
  clamp_min: 0.0
  clamp_max: 1.0

policy_transfer:
  type: filesystem
  export_initial: true
  export_every_steps: 1
  poll_interval_seconds: 0.05

optim:
  type: adam
  implementation: fused
  lr: 6e-5
  weight_decay: 0.001
  betas: [0.9, 0.999]

scheduler:
  type: constant
  warmup_steps: 10
  min_lr: 0.0

lora:
  rank: 32
  alpha: 64.0
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

max_grad_norm: 1.0
max_steps: 1000
seed: 3407

monitor:
  enabled: true
  samples:
    enabled: true
    interval: 5
    sample_ratio: 0.25
    max_samples: 8
  wandb:
    enabled: true
    project: wavelet-unsloth-math
    name: wavelet-unsloth-qwen8b-math-rl
    mode: online

launcher:
  mode: process
  backend: local
  inference_num_replicas: 4
  inference_cuda_visible_devices:
    - "0"
    - "1"
    - "2"
    - "3"
  trainer_num_processes: 4
  trainer_cuda_visible_devices: "4,5,6,7"

output_dir: outputs/unsloth_math_rl
clean_output_dir: true
