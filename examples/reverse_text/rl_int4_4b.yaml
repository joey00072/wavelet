model:
  name: "Qwen/Qwen3-4B-Instruct-2507"
  torch_dtype: bfloat16
  attn_implementation: auto
  load_in_4bit: true
  gradient_checkpointing: true
  matmul_precision: high

data:
  source: local
  path: outputs/reverse_text_data/rl_train.jsonl
  batch_size: 8
  micro_batch_size: 1
  pack_sequences: true
  pad_to_multiple_of: 1
  seq_len: 2048
  max_examples: 256
  shuffle: true
  seed: 42

loss:
  type: dppo
  dppo_mask_high: 0.2
  dppo_mask_low: 0.2
  kl_tau: 1e-3

algo:
  type: grpo

orchestrator:
  enabled: true
  custom_rollout_function: wavelet.orchestrator.verifiers:generate_rollouts
  verifier_env_id: reverse-text
  verifier_model: Qwen/Qwen3-4B-Instruct-2507
  verifier_client_type: openai_chat_completions_token
  examples_per_step: 8
  rollouts_per_example: 4
  filter_zero_advantage: true
  zero_advantage_max_retries: 4
  max_async_level: 1
  max_off_policy_steps: 2
  state_server:
    enabled: true
    host: 0.0.0.0
    port: 8765

transport:
  poll_interval_seconds: 0.05

eval:
  interval: 25
  num_examples: 16
  rollouts_per_example: 2
  eval_base_model: true
  final_eval: true
  sampling:
    temperature: 0.7
    top_p: 1.0
    top_k: -1
    min_p: 0.0
    repetition_penalty: 1.0
    max_completion_tokens: 96
  env:
    - id: reverse-text
      name: reverse-text

inference:
  enabled: true
  mode: vllm_http
  default_temperature: 0.7
  sampling:
    temperature: 0.7
    top_p: 1.0
    top_k: -1
    min_p: 0.0
    repetition_penalty: 1.0
    max_completion_tokens: 96
    do_sample: true
    num_generations: 1
    seed: null
  vllm:
    server_backend: openai
    dtype: bfloat16
    quantization: bitsandbytes
    load_format: bitsandbytes
    gpu_memory_utilization: 0.9
    max_model_len: 2048
    enforce_eager: false
    max_lora_rank: 16
  http:
    request_timeout_seconds: 300.0
    startup_timeout_seconds: 900.0

reward:
  mode: passthrough

policy_transfer:
  type: filesystem
  export_initial: true
  export_every_steps: 1
  poll_interval_seconds: 0.05

fsdp:
  enabled: false
  backend: nccl
  dp_replicate: 1
  dp_shard: 1
  cp: 1
  tp: 1
  ep: 1
  cpu_offload: false

optim:
  type: paged_adamw_8bit
  implementation: for-loop
  lr: 3e-5
  weight_decay: 0.0
  betas: [0.9, 0.999]

scheduler:
  type: constant

lora:
  rank: 16
  alpha: 32.0
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

max_grad_norm: 1.0
max_steps: 100
seed: 42

monitor:
  enabled: true
  samples:
    enabled: true
    interval: 2
    sample_ratio: 0.5
    max_samples: 8
  wandb:
    enabled: false

launcher:
  mode: process
  backend: local
  inference_cuda_visible_devices: "0"
  trainer_cuda_visible_devices: "1"
  trainer_num_processes: 1
  inference_num_replicas: 1

output_dir: outputs/reverse_text_int4_4b
