model:
  name: "Qwen/Qwen3-30B-A3B-Thinking-2507"
  torch_dtype: bfloat16
  attn_implementation: auto
  trust_remote_code: true
  gradient_checkpointing: true
  allow_tf32: true
  fused_lm_head_token_chunk_size: auto

data:
  source: local
  path: outputs/qwen30b_math_data/rl_train.jsonl
  batch_size: 512
  micro_batch_size: 1
  pack_sequences: true
  seq_len: 32768
  shuffle: true
  seed: 42

loss:
  type: dppo
  dppo_mask_high: 0.2
  dppo_mask_low: 0.2
  kl_tau: 0.001

algo:
  type: grpo

orchestrator:
  enabled: true
  custom_rollout_function: wavelet.orchestrator.verifiers:generate_rollouts
  verifier_env_id: math-env
  verifier_model: Qwen/Qwen3-30B-A3B-Thinking-2507
  verifier_client_type: openai_chat_completions_token
  examples_per_step: 64
  rollouts_per_example: 8
  oversampling_factor: 2.0
  filter_zero_advantage: true
  zero_advantage_max_retries: 8
  max_async_level: 8
  max_off_policy_steps: 8

eval:
  interval: 25
  num_examples: 30
  rollouts_per_example: 4
  final_eval: false
  sampling:
    max_completion_tokens: 32768
  env:
    - id: aime2025
      name: aime2025

inference:
  enabled: true
  mode: vllm_http
  sampling:
    temperature: 1.0
    top_p: 1.0
    max_completion_tokens: 32768
    do_sample: true
  vllm:
    server_backend: openai
    gpu_memory_utilization: 0.9
    max_model_len: 32768
    tensor_parallel_size: 4
    data_parallel_size: 2
    data_parallel_size_local: 2
    enforce_eager: false
  http:
    port: 8000
    request_timeout_seconds: 1800.0
    startup_timeout_seconds: 1800.0

reward:
  mode: passthrough

policy_transfer:
  type: filesystem
  export_initial: true
  export_every_steps: 1

fsdp:
  enabled: true
  backend: nccl
  dp_replicate: 1
  dp_shard: -1
  ep: 8

optim:
  type: adamw
  implementation: fused
  lr: 1e-6
  weight_decay: 0.01

scheduler:
  type: constant

lora:
  rank: 32
  alpha: 64.0
  dropout: 0.0

max_grad_norm: 1.0
max_steps: 500
seed: 42

monitor:
  enabled: true
  wandb:
    enabled: true
    project: wavelet-qwen30b-math
    name: wavelet-qwen30b-math-single-node-rl
    mode: online

launcher:
  mode: process
  backend: local
  inference_cuda_visible_devices: "0,1,2,3,4,5,6,7"
  trainer_cuda_visible_devices: "0,1,2,3,4,5,6,7"
  trainer_num_processes: 8
  inference_num_replicas: 1

output_dir: outputs/qwen30b_math_rl
clean_output_dir: true
