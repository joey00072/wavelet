model:
  name: Qwen/Qwen2.5-7B-Instruct
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2
  load_in_4bit: false
  activation_checkpointing:
    mode: full
  matmul_precision: high
  fused_lm_head_token_chunk_size: auto
data:
  source: local
  path: outputs/polaris_math_tagged_data/rl_train.jsonl
  batch_size: 256
  micro_batch_size: 2
  pack_sequences: false
  pad_to_multiple_of: 1
  seq_len: 8192
  max_examples: 16
  shuffle: false
  seed: 48
loss:
  type: dppo
  dppo_mask_high: 0.2
  dppo_mask_low: 0.2
  kl_tau: 0.0
algo:
  type: grpo
  normalize_advantages: false
orchestrator:
  enabled: true
  live_traces: false
  custom_rollout_function: wavelet.orchestrator.verifiers:generate_rollouts
  verifier_env_id: polaris-math-tagged
  verifier_env_args:
    min_difficulty: 1
    max_difficulty: 6
    math_verify_max_workers: 128
    math_verify_timeout: 5
  verifier_model: Qwen/Qwen2.5-7B-Instruct
  verifier_client_type: openai_chat_completions_token
  verifier_max_retries: 2
  examples_per_step: 16
  rollouts_per_example: 16
  rollout_chunk_examples: 16
  filter_zero_advantage: false
  zero_advantage_max_retries: 8
  max_async_level: 4
  max_off_policy_steps: 4
  max_pending_rollout_chunks: 16
  overwrite: true
  state_server:
    enabled: true
    host: 0.0.0.0
    port: 8765
  max_inflight_rollouts: 256
transport:
  poll_interval_seconds: 0.05
  cleanup_consumed: true
  keep_last_consumed: 8
eval:
  live_traces: false
  interval: 5
  num_examples: 30
  rollouts_per_example: 8
  eval_base_model: true
  final_eval: true
  keep_last_rollout_sets: 2
  sampling:
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    min_p: 0.0
    repetition_penalty: 1.0
    max_completion_tokens: 7168
    extra_body:
      stop:
      - </answer>
      include_stop_str_in_output: true
  env:
  - id: polaris-math-tagged
    name: aime2024
inference:
  enabled: true
  mode: vllm_http
  default_temperature: 1.0
  sampling:
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    min_p: 0.0
    repetition_penalty: 1.0
    max_prompt_tokens: 1024
    max_completion_tokens: 7168
    do_sample: true
    num_generations: 1
    seed: null
    extra_body:
      stop:
      - </answer>
      include_stop_str_in_output: true
  vllm:
    server_backend: openai
    dtype: bfloat16
    gpu_memory_utilization: 0.9
    max_model_len: 8192
    enforce_eager: false
    max_lora_rank: 16
    tensor_parallel_size: 1
    data_parallel_size: 8
    data_parallel_size_local: 8
  http:
    request_timeout_seconds: 900.0
    startup_timeout_seconds: 1800
reward:
  mode: passthrough
policy_transfer:
  type: filesystem
  export_initial: true
  export_every_steps: 1
  poll_interval_seconds: 0.05
  keep_last: 8
ckpt:
  mode: async
  interval: 100
  keep_last: 2
fsdp:
  enabled: true
  backend: nccl
  dp_replicate: 1
  dp_shard: -1
  cp: 1
  tp: 1
  ep: 1
  cpu_offload: false
optim:
  type: adamw
  implementation: for-loop
  lr: 5.0e-05
  weight_decay: 0.0
  betas:
  - 0.9
  - 0.999
scheduler:
  type: constant
lora:
  rank: 16
  alpha: 32.0
  dropout: 0.0
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
max_grad_norm: 1.0
max_steps: 20
seed: 48
monitor:
  enabled: true
  samples:
    enabled: true
    interval: 1
    sample_ratio: 0.25
    max_samples: 8
  wandb:
    enabled: true
    project: wavelet-polaris
    name: qwen2.5-7b-polaris-slurm-16x16-diagnostic
    mode: online
launcher:
  mode: process
  backend: local
output_dir: outputs/qwen2_5_7b_polaris_slurm_16x16
clean_output_dir: false
deployment:
  type: multi_node
  num_train_nodes: 1
  num_inference_nodes: 3
  gpus_per_node: 8
slurm:
  job_name: wavelet-polaris-16x16
  project_dir: .
  partition: gpu-nodes
  time_limit: '24:00:00'
  exclusive: true
  shared_fs: true
