model:
  name: "PrimeIntellect/Qwen3-1.7B-Wordle-SFT"
  torch_dtype: float32
  attn_implementation: auto
  gradient_checkpointing: true
  allow_tf32: true
  fused_lm_head_token_chunk_size: auto

data:
  source: local
  path: outputs/wordle_data/rl_train.jsonl
  batch_size: 1024
  micro_batch_size: 1
  pack_sequences: true
  seq_len: 8192
  shuffle: true
  seed: 42

loss:
  type: dppo
  dppo_mask_high: 0.2
  dppo_mask_low: 0.2
  kl_tau: 0.001

algo:
  type: grpo

orchestrator:
  enabled: true
  custom_rollout_function: wavelet.orchestrator.verifiers:generate_rollouts
  verifier_env_id: primeintellect/wordle
  verifier_model: PrimeIntellect/Qwen3-1.7B-Wordle-SFT
  verifier_client_type: openai_chat_completions_token
  examples_per_step: 64
  rollouts_per_example: 16
  oversampling_factor: 1.0
  filter_zero_advantage: true
  zero_advantage_max_retries: 8
  max_async_level: 1
  max_off_policy_steps: 8

eval:
  interval: 25
  num_examples: 20
  rollouts_per_example: 8
  eval_base_model: true
  final_eval: true
  sampling:
    max_completion_tokens: 1024
  env:
    - id: primeintellect/wordle
      name: wordle

inference:
  enabled: true
  mode: vllm_http
  sampling:
    temperature: 1.0
    top_p: 1.0
    max_completion_tokens: 1024
    do_sample: true
  vllm:
    server_backend: openai
    dtype: bfloat16
    gpu_memory_utilization: 0.9
    max_model_len: 8192
    data_parallel_size: 6
    data_parallel_size_local: 6
    enforce_eager: false
    max_lora_rank: 32
    openai_batch_wait_seconds: 0.05
    openai_batch_min_size: 16
    openai_batch_max_wait_seconds: 0.2
  http:
    port: 8000
    request_timeout_seconds: 900.0
    startup_timeout_seconds: 900.0

reward:
  mode: passthrough

policy_transfer:
  type: filesystem
  export_initial: true
  export_every_steps: 1

fsdp:
  enabled: true
  backend: nccl
  dp_replicate: 1
  dp_shard: -1

optim:
  type: adamw
  implementation: fused
  lr: 1e-6
  weight_decay: 0.01

scheduler:
  type: constant

lora: null

max_grad_norm: 1.0
max_steps: 200
seed: 42

monitor:
  enabled: true
  wandb:
    enabled: true
    project: wavelet-wordle
    name: wavelet-wordle-1.7b-rl
    mode: online

launcher:
  mode: process
  backend: local
  inference_cuda_visible_devices: "2,3,4,5,6,7"
  trainer_cuda_visible_devices: "0,1"
  trainer_num_processes: 2
  inference_num_replicas: 1

output_dir: outputs/wordle_rl
clean_output_dir: true
