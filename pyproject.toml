[project]
name = "wavelet"
version = "0.1.0"
description = "Distributed LLM post-training library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "torch>=2.6.0",
    "transformers>=4.40",
    "pyyaml>=6.0",
    "tensorboard>=2.15",
    "wandb>=0.16",
    "tqdm>=4.66",
    "datasets>=2.18",
    "accelerate>=0.28",
    "peft>=0.10",
    "torchdata>=0.7",
    "bitsandbytes>=0.43",
    "liger-kernel>=0.7.0",
    "xformers>=0.0.35",
    "vllm>=0.8.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "math-verify>=0.9.0",
    "urllib3<2.6",
    "chardet<6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "pytest>=8.0",
]
verifiers = [
    "verifiers",
]
envs = [
    "alphabet-sort",
    "aime2025",
    "aime2024",
    "code-env; platform_system == 'Linux' and platform_machine == 'x86_64' and python_version >= '3.12'",
    "deepdive; platform_system == 'Linux' and platform_machine == 'x86_64' and python_version >= '3.12'",
    "logic-env; platform_system == 'Linux' and platform_machine == 'x86_64' and python_version >= '3.12'",
    "math-env",
    "math-python; platform_system == 'Linux' and platform_machine == 'x86_64' and python_version >= '3.12'",
    "math500; platform_system == 'Linux' and platform_machine == 'x86_64' and python_version >= '3.12'",
    "mini_swe_agent_plus; platform_system == 'Linux' and platform_machine == 'x86_64' and python_version >= '3.12'",
    "reverse-text",
    "science-env; platform_system == 'Linux' and platform_machine == 'x86_64' and python_version >= '3.12'",
    "wiki-search; platform_system == 'Linux' and platform_machine == 'x86_64' and python_version >= '3.12'",
]
flash-attn = [
    "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.0/flash_attn-2.8.3%2Bcu128torch2.10-cp312-cp312-linux_x86_64.whl ; platform_system == 'Linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "flash-attn>=2.8.3; platform_system == 'Linux' and platform_machine == 'x86_64' and python_version != '3.12'",
]

[project.entry-points."vllm.general_plugins"]
wavelet = "wavelet.inference.patches:transformers_v5_compat"

[tool.uv]
no-build-isolation-package = ["flash-attn"]

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]

[tool.uv.sources]
verifiers = { git = "https://github.com/PrimeIntellect-ai/verifiers.git", rev = "77a9f28" }
alphabet-sort = { index = "primeintellect" }
aime2025 = { index = "primeintellect" }
aime2024 = { index = "primeintellect" }
code-env = { index = "primeintellect" }
deepdive = { index = "primeintellect" }
logic-env = { index = "primeintellect" }
math-env = { index = "primeintellect" }
math-python = { index = "primeintellect" }
math500 = { index = "primeintellect" }
mini_swe_agent_plus = { index = "primeintellect" }
reverse-text = { index = "primeintellect" }
science-env = { index = "primeintellect" }
wiki-search = { index = "primeintellect" }

[[tool.uv.index]]
name = "primeintellect"
url = "https://hub.primeintellect.ai/primeintellect/simple/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["ref"]
addopts = ["--strict-markers"]
markers = [
    "gpu: requires a CUDA-capable GPU",
    "integration: exercises multiple Wavelet subsystems or an optional integration",
    "slow: takes substantially longer than an ordinary unit test",
]
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["outputs", "ref"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wavelet"]
