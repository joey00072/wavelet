[project]
name = "wavelet"
version = "0.1.0"
description = "Distributed LLM post-training library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "torch>=2.6.0",
    "transformers>=4.40",
    "pyyaml>=6.0",
    "tensorboard>=2.15",
    "wandb>=0.16",
    "tqdm>=4.66",
    "datasets>=2.18",
    "accelerate>=0.28",
    "peft>=0.10",
    "torchdata>=0.7",
    "bitsandbytes>=0.43",
    "liger-kernel>=0.7.0",
    "xformers>=0.0.35",
    "vllm>=0.8.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "math-verify>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "pytest>=8.0",
]
verifiers = [
    "verifiers",
]
envs = [
    "alphabet-sort",
    "aime2025",
    "math-env",
    "reverse-text",
]

[tool.uv.sources]
verifiers = { git = "https://github.com/PrimeIntellect-ai/verifiers.git", rev = "77a9f28" }
alphabet-sort = { index = "primeintellect" }
aime2025 = { index = "primeintellect" }
math-env = { index = "primeintellect" }
reverse-text = { index = "primeintellect" }

[[tool.uv.index]]
name = "primeintellect"
url = "https://hub.primeintellect.ai/primeintellect/simple/"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wavelet"]
