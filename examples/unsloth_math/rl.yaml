model:
  name: "unsloth/Llama-3.2-1B-Instruct"
  adapter_path: outputs/unsloth_math_sft/adapter
  torch_dtype: bfloat16
  attn_implementation: sdpa
  load_in_4bit: false
  gradient_checkpointing: true
  allow_tf32: true
  chat_template: |-
    {% if messages[0]['role'] == 'system' %}{{ messages[0]['content'] + eos_token }}{% set loop_messages = messages[1:] %}{% else %}{{ 'You are given a problem.
    Think about the problem and provide your working out.
    Place it between <start_working_out> and <end_working_out>.
    Then, provide your solution between <SOLUTION></SOLUTION>' + eos_token }}{% set loop_messages = messages %}{% endif %}{% for message in loop_messages %}{% if message['role'] == 'user' %}{{ message['content'] }}{% elif message['role'] == 'assistant' %}{{ message['content'] + eos_token }}{% endif %}{% endfor %}{% if add_generation_prompt %}{{ '<start_working_out>' }}{% endif %}

data:
  source: local
  path: outputs/unsloth_math_data/rl_train.jsonl
  prompt_column: prompt
  completion_column: solution
  system_prompt: |-
    You are given a problem.
    Think about the problem and provide your working out.
    Place it between <start_working_out> and <end_working_out>.
    Then, provide your solution between <SOLUTION></SOLUTION>
  batch_size: 16
  micro_batch_size: 1
  seq_len: 512
  max_examples: 128
  shuffle: true
  seed: 3407

loss:
  type: dppo
  kl_tau: 0.1

orchestrator:
  enabled: true
  advantage_mode: group_reward
  normalize_group_advantages: false
  examples_per_step: 2
  rollouts_per_example: 8
  filter_zero_advantage: true
  zero_advantage_max_retries: 8
  max_async_level: 1
  max_off_policy_steps: 1

inference:
  enabled: true
  mode: vllm_http
  default_temperature: 1.0
  sampling:
    temperature: 1.0
    top_p: 1.0
    top_k: 50
    repetition_penalty: 1.0
    max_completion_tokens: 128
    do_sample: true
    num_generations: 8
    seed: 3407
  vllm:
    gpu_memory_utilization: 0.45
    max_model_len: 512
    enforce_eager: true
    max_loras: 8
    max_cpu_loras: 100
    max_lora_rank: 32
  http:
    request_timeout_seconds: 900.0
    startup_timeout_seconds: 900.0

reward:
  mode: math_format
  normalize_whitespace: true
  case_sensitive: true
  rescale_min: -10.0
  rescale_max: 13.0
  clamp_min: 0.0
  clamp_max: 1.0

policy_transfer:
  export_initial: true

optim:
  type: adamw
  implementation: for-loop
  lr: 5e-5
  weight_decay: 0.01

scheduler:
  type: linear
  warmup_steps: 10
  min_lr: 0.0

lora:
  rank: 32
  alpha: 64.0
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

max_grad_norm: 1.0
max_steps: 100
seed: 3407

monitor:
  enabled: true
  samples:
    enabled: true
    interval: 10
    sample_ratio: 0.25
    max_samples: 8
  wandb:
    enabled: true
    project: wavelet-unsloth-math
    name: wavelet-unsloth-math-rl
    mode: online

launcher:
  mode: process
  backend: local

output_dir: outputs/unsloth_math_rl
