model:
  name: "Qwen/Qwen3-4B-Instruct-2507"
  torch_dtype: bfloat16
  attn_implementation: sdpa
  load_in_4bit: false
  gradient_checkpointing: true
  allow_tf32: true
  fused_lm_head_token_chunk_size: auto

data:
  source: local
  path: outputs/qwen4b_math_data/rl_train.jsonl
  batch_size: 512
  micro_batch_size: 1
  pack_sequences: true
  pad_to_multiple_of: 1
  seq_len: 32768
  max_examples: null
  shuffle: true
  seed: 42

loss:
  type: dppo
  dppo_mask_high: 0.2
  dppo_mask_low: 0.2
  kl_tau: 0.001

orchestrator:
  enabled: true
  custom_rollout_function: wavelet.orchestrator.verifiers:generate_rollouts
  verifier_env_id: math-env
  verifier_env_args:
    math_verify_max_workers: 128
    math_verify_timeout: 60
  verifier_model: Qwen/Qwen3-4B-Instruct-2507
  verifier_client_type: openai_chat_completions_token
  advantage_mode: group_reward
  normalize_group_advantages: false
  examples_per_step: 4
  rollouts_per_example: 8
  oversampling_factor: 2.0
  rollout_chunk_examples: 1
  filter_zero_advantage: true
  zero_advantage_max_retries: 8
  max_async_level: 4
  max_off_policy_steps: 8

eval:
  interval: 25
  num_examples: 30
  rollouts_per_example: 4
  eval_base_model: false
  final_eval: false
  sampling:
    max_completion_tokens: 8192
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  env:
    - id: aime2025
      rollouts_per_example: 4

inference:
  enabled: true
  mode: vllm_http
  default_temperature: 1.0
  sampling:
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    min_p: 0.0
    repetition_penalty: 1.0
    max_completion_tokens: 8192
    do_sample: true
    num_generations: 1
    seed: null
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  vllm:
    server_backend: openai
    gpu_memory_utilization: 0.9
    max_model_len: 32768
    enforce_eager: false
    max_loras: 8
    max_cpu_loras: 100
    max_lora_rank: 32
  http:
    port: 8000
    request_timeout_seconds: 1800.0
    startup_timeout_seconds: 1800.0

reward:
  mode: passthrough

policy_transfer:
  type: filesystem
  export_initial: true

ckpt:
  mode: async
  interval: 100
  keep_last: 2

fsdp:
  enabled: true
  backend: nccl
  dp_replicate: 1
  dp_shard: -1
  cp: 1
  tp: 1
  ep: 1
  cpu_offload: false
  reshard_after_forward: true

optim:
  type: adamw
  implementation: fused
  lr: 5e-5
  weight_decay: 0.01

scheduler:
  type: constant

lora:
  rank: 32
  alpha: 64.0
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    - experts
    - fc1_latent_proj
    - fc2_latent_proj

max_grad_norm: 1.0
max_steps: 1000
seed: 42

monitor:
  enabled: true
  samples:
    enabled: true
    interval: 10
    sample_ratio: 0.25
    max_samples: 8
  wandb:
    enabled: true
    project: wavelet-qwen4b-math
    name: wavelet-qwen4b-math-rl
    mode: online

launcher:
  mode: process
  backend: local
  inference_num_replicas: 4
  inference_cuda_visible_devices:
    - "0"
    - "1"
    - "2"
    - "3"
  trainer_num_processes: 4
  trainer_cuda_visible_devices: "4,5,6,7"

output_dir: outputs/qwen4b_math_rl
clean_output_dir: true
