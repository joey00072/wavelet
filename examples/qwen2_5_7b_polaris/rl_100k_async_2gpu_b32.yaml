model:
  name: "Qwen/Qwen2.5-7B-Instruct"
  adapter_path: outputs/qwen2_5_7b_polaris_recovery_sft/adapter
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2
  load_in_4bit: false
  activation_checkpointing:
    mode: full
  matmul_precision: high
  fused_lm_head_token_chunk_size: auto

data:
  source: local
  path: outputs/polaris_math_tagged_data/rl_train.jsonl
  batch_size: 32
  micro_batch_size: 16
  pack_sequences: false
  pad_to_multiple_of: 1
  seq_len: 8192
  max_examples: null
  shuffle: true
  seed: 48

loss:
  type: dppo
  dppo_mask_high: 0.2
  dppo_mask_low: 0.2
  kl_tau: 0.0

algo:
  type: grpo
  normalize_advantages: false

orchestrator:
  enabled: true
  custom_rollout_function: wavelet.orchestrator.verifiers:generate_rollouts
  verifier_env_id: polaris-math-tagged
  verifier_env_args:
    min_difficulty: 1
    max_difficulty: 6
    math_verify_max_workers: 128
    math_verify_timeout: 5
  verifier_model: Qwen/Qwen2.5-7B-Instruct
  verifier_client_type: openai_chat_completions_token
  verifier_max_retries: 2
  examples_per_step: 32
  rollouts_per_example: 8
  rollout_chunk_examples: 8
  filter_zero_advantage: true
  zero_advantage_max_retries: 8
  max_async_level: 4
  max_off_policy_steps: 4
  max_pending_rollout_chunks: 8
  overwrite: true
  state_server:
    enabled: true
    host: 0.0.0.0
    port: 8765

transport:
  poll_interval_seconds: 0.05
  cleanup_consumed: true
  keep_last_consumed: 8

eval:
  interval: 100
  num_examples: 30
  rollouts_per_example: 8
  eval_base_model: true
  final_eval: true
  keep_last_rollout_sets: 2
  sampling:
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    min_p: 0.0
    repetition_penalty: 1.0
    max_completion_tokens: 7168
    extra_body:
      stop:
        - "</answer>"
      include_stop_str_in_output: true
  env:
    - id: polaris-math-tagged
      name: aime2024

inference:
  enabled: true
  mode: vllm_http
  default_temperature: 1.0
  sampling:
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    min_p: 0.0
    repetition_penalty: 1.0
    max_prompt_tokens: 1024
    max_completion_tokens: 7168
    do_sample: true
    num_generations: 1
    seed: null
    extra_body:
      stop:
        - "</answer>"
      include_stop_str_in_output: true
  vllm:
    server_backend: openai
    dtype: bfloat16
    gpu_memory_utilization: 0.9
    max_model_len: 8192
    enforce_eager: false
    max_lora_rank: 16
  http:
    request_timeout_seconds: 900.0
    startup_timeout_seconds: 900.0

reward:
  mode: passthrough

policy_transfer:
  type: filesystem
  export_initial: true
  export_every_steps: 1
  poll_interval_seconds: 0.05
  keep_last: 8

ckpt:
  mode: async
  interval: 100
  keep_last: 2

fsdp:
  enabled: false
  backend: nccl
  dp_replicate: 1
  dp_shard: 1
  cp: 1
  tp: 1
  ep: 1
  cpu_offload: false

optim:
  type: adamw
  implementation: for-loop
  lr: 5.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.999]

scheduler:
  type: constant

lora:
  rank: 16
  alpha: 32.0
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

max_grad_norm: 1.0
max_steps: 100000
seed: 48

monitor:
  enabled: true
  samples:
    enabled: true
    interval: 10
    sample_ratio: 0.25
    max_samples: 8
  wandb:
    enabled: true
    project: wavelet-polaris
    name: qwen2.5-7b-polaris-async-2gpu-b32x8
    mode: online

launcher:
  mode: process
  backend: local
  inference_cuda_visible_devices: "1"
  trainer_cuda_visible_devices: "0"
  trainer_num_processes: 1
  inference_num_replicas: 1

output_dir: outputs/qwen2_5_7b_polaris_async_2gpu_b32x8
clean_output_dir: true
