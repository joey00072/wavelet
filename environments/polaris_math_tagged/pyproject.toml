[project]
name = "polaris-math-tagged"
version = "0.1.0"
description = "Polaris math training with strict tagged AIME 2024 evaluation"
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "math-verify",
    "verifiers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["polaris_math_tagged.py"]
