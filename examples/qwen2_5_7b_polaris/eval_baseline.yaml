model:
  name: "Qwen/Qwen2.5-7B-Instruct"
  torch_dtype: bfloat16
  attn_implementation: auto
  load_in_4bit: false
  matmul_precision: high

data:
  source: local
  path: outputs/polaris_math_tagged_data/rl_train.jsonl
  batch_size: 8
  micro_batch_size: 1
  seq_len: 8192
  shuffle: true
  seed: 42

orchestrator:
  enabled: true
  custom_rollout_function: wavelet.orchestrator.verifiers:generate_rollouts
  verifier_env_id: polaris-math-tagged
  verifier_env_args:
    min_difficulty: 1
    max_difficulty: 6
    math_verify_max_workers: 128
    math_verify_timeout: 60
  verifier_model: Qwen/Qwen2.5-7B-Instruct
  verifier_client_type: openai_chat_completions_token
  max_async_level: 0
  max_off_policy_steps: 0
  state_server:
    enabled: true
    host: 0.0.0.0
    port: 8765

eval:
  interval: 100
  num_examples: 30
  rollouts_per_example: 8
  eval_base_model: true
  final_eval: true
  keep_last_rollout_sets: 1
  sampling:
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    min_p: 0.0
    repetition_penalty: 1.0
    max_completion_tokens: 7168
    extra_body:
      stop:
        - "</answer>"
      include_stop_str_in_output: true
  env:
    - id: polaris-math-tagged
      name: aime2024

inference:
  enabled: true
  mode: vllm_http
  default_temperature: 1.0
  sampling:
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    min_p: 0.0
    repetition_penalty: 1.0
    max_prompt_tokens: 1024
    max_completion_tokens: 7168
    do_sample: true
    num_generations: 1
    seed: null
    extra_body:
      stop:
        - "</answer>"
      include_stop_str_in_output: true
  vllm:
    server_backend: openai
    dtype: bfloat16
    gpu_memory_utilization: 0.8
    max_model_len: 8192
    enforce_eager: false
  http:
    request_timeout_seconds: 900.0
    startup_timeout_seconds: 900.0

reward:
  mode: passthrough

policy_transfer:
  type: filesystem
  export_initial: true

fsdp:
  enabled: false

max_steps: 0
seed: 42

monitor:
  enabled: true
  wandb:
    enabled: true
    project: wavelet-polaris
    name: qwen2.5-7b-aime2024-baseline-pass8
    mode: online

launcher:
  mode: process
  backend: local
  inference_cuda_visible_devices: "0"
  trainer_cuda_visible_devices: "0"
  trainer_num_processes: 1
  inference_num_replicas: 1

output_dir: outputs/qwen2_5_7b_aime2024_baseline
clean_output_dir: true
