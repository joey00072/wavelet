model:
  name: "Qwen/Qwen2.5-7B-Instruct"
  torch_dtype: bfloat16
  attn_implementation: sdpa
  load_in_4bit: false
  activation_checkpointing:
    mode: full
  matmul_precision: high

data:
  source: local
  path: outputs/polaris_wait_recoveries/correct_recoveries.jsonl
  batch_size: 8
  micro_batch_size: 1
  seq_len: 2048
  pack_function: pad
  shuffle: true
  seed: 47

optim:
  type: adamw
  implementation: fused
  lr: 2.0e-4
  weight_decay: 0.0
  betas: [0.9, 0.999]

scheduler:
  type: constant
  warmup_steps: 0

lora:
  rank: 16
  alpha: 32.0
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

loss_impl: torch
max_grad_norm: 1.0
epochs: 3
max_steps: null
seed: 47

ckpt:
  mode: disabled

monitor:
  enabled: true
  wandb:
    enabled: true
    project: wavelet-polaris
    name: qwen2.5-7b-polaris-recovery-sft
    mode: online

fsdp:
  enabled: false

output_dir: outputs/qwen2_5_7b_polaris_recovery_sft
clean_output_dir: true
