name: GPU Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: gpu-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULED_GPU_CHECKS == 'true'
    name: GPU tests
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 60
    env:
      WANDB_MODE: disabled
      UV_LINK_MODE: copy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --extra dev --locked
      - name: Check GPU availability
        run: nvidia-smi
      - name: Require CUDA in the test environment
        run: uv run python -c "import torch; assert torch.cuda.is_available(), 'GPU CI requires CUDA-enabled PyTorch and a visible device'"
      - name: Run GPU tests
        run: uv run pytest tests -m gpu --junitxml=outputs/ci/gpu-tests.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/ci/gpu-tests.xml
          if-no-files-found: warn
