model:
  name: "Qwen/Qwen3-4B-Instruct-2507"
  torch_dtype: float32
  attn_implementation: auto
  gradient_checkpointing: true
  allow_tf32: true
  fused_lm_head_token_chunk_size: auto

data:
  source: local
  path: outputs/wiki_search_data/rl_train.jsonl
  batch_size: 512
  micro_batch_size: 1
  pack_sequences: true
  seq_len: 4096
  shuffle: true
  seed: 42

loss:
  type: dppo
  dppo_mask_high: 0.2
  dppo_mask_low: 0.2
  kl_tau: 0.001

algo:
  type: grpo

orchestrator:
  enabled: true
  custom_rollout_function: wavelet.orchestrator.verifiers:generate_rollouts
  verifier_env_id: primeintellect/wiki-search
  verifier_env_args:
    judge_model: kimi-k2.6
    judge_base_url: https://opencode.ai/zen/go/v1
    judge_api_key_var: OPENCODE_API_KEY
  verifier_model: Qwen/Qwen3-4B-Instruct-2507
  verifier_client_type: openai_chat_completions_token
  examples_per_step: 32
  rollouts_per_example: 16
  oversampling_factor: 2.0
  filter_zero_advantage: true
  zero_advantage_max_retries: 8
  max_async_level: 8
  max_off_policy_steps: 8

inference:
  enabled: true
  mode: vllm_http
  sampling:
    temperature: 1.0
    top_p: 1.0
    max_completion_tokens: 512
    do_sample: true
  vllm:
    server_backend: openai
    dtype: bfloat16
    gpu_memory_utilization: 0.9
    max_model_len: 4096
    data_parallel_size: 6
    data_parallel_size_local: 6
    enforce_eager: false
    openai_batch_wait_seconds: 0.05
    openai_batch_min_size: 16
    openai_batch_max_wait_seconds: 0.2
  http:
    port: 8000
    request_timeout_seconds: 900.0
    startup_timeout_seconds: 900.0

reward:
  mode: passthrough

policy_transfer:
  type: filesystem
  export_initial: true
  export_every_steps: 1

fsdp:
  enabled: true
  backend: nccl
  dp_replicate: 1
  dp_shard: -1

optim:
  type: adamw
  implementation: fused
  lr: 1e-5
  weight_decay: 0.0

scheduler:
  type: constant

lora:
  rank: 8
  alpha: 16.0
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

max_grad_norm: 1.0
max_steps: 200
seed: 42

monitor:
  enabled: true
  wandb:
    enabled: true
    project: wavelet-wiki-search
    name: wavelet-wiki-search-4b-rl
    mode: online

launcher:
  mode: process
  backend: local
  inference_cuda_visible_devices: "2,3,4,5,6,7"
  trainer_cuda_visible_devices: "0,1"
  trainer_num_processes: 2
  inference_num_replicas: 1

output_dir: outputs/wiki_search_rl
clean_output_dir: true
